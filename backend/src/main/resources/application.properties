server.port=${PORT:8080}

# In-memory H2 for the prototype (resets on restart). Swap for Postgres later via env vars.
spring.datasource.url=jdbc:h2:mem:finnova;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Comma-separated list. Override on Render with APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=http://localhost:4200,https://*.vercel.app
